<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#f8fafc" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>My Tasks — QC Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* =========================================================
   ROOT
========================================================= */

      :root {
        --primary: #111827;
        --primary-light: #1f2937;

        --accent: #2563eb;
        --accent-light: #eff6ff;

        --success: #16a34a;
        --success-light: #f0fdf4;

        --warning: #d97706;
        --warning-light: #fffbeb;

        --danger: #dc2626;
        --danger-light: #fef2f2;

        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;

        --background: #f8fafc;
        --white: #ffffff;
      }

      /* =========================================================
   RESET
========================================================= */

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      body {
        font-family: "Inter", sans-serif;

        background: var(--background);
        color: var(--text);

        height: 100dvh;

        overscroll-behavior: none;
        touch-action: manipulation;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      /* =========================================================
   APP
========================================================= */

      .app {
        width: 100%;
        height: 100dvh;

        display: flex;
        justify-content: center;

        overflow: hidden;

        background:
          radial-gradient(
            circle at 50% -10%,
            rgba(37, 99, 235, 0.08),
            transparent 30%
          ),
          var(--background);
      }

      .mobile-container {
        width: 100%;
        max-width: 480px;
        height: 100dvh;

        display: flex;
        flex-direction: column;

        position: relative;

        overflow: hidden;
      }

      /* =========================================================
   HEADER
========================================================= */

      .app-header {
        flex-shrink: 0;

        padding: max(18px, env(safe-area-inset-top)) 20px 12px;

        background: rgba(248, 250, 252, 0.94);

        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        display: flex;
        align-items: center;

        gap: 10px;

        z-index: 50;
      }

      .back-btn {
        width: 38px;
        height: 38px;

        padding: 0;

        border: 1px solid var(--border);
        border-radius: 12px;

        background: #fff;
        color: var(--primary);

        display: flex;
        align-items: center;
        justify-content: center;

        flex-shrink: 0;
      }

      .back-btn:active {
        transform: scale(0.94);
      }

      .back-btn svg {
        width: 18px;
        height: 18px;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      .header-left {
        min-width: 0;
        flex: 1;
      }

      .header-title {
        font-size: 14px;
        line-height: 1.2;
        font-weight: 800;
      }

      .header-subtitle {
        margin-top: 3px;

        color: var(--muted);

        font-size: 10px;
        font-weight: 500;
      }

      .header-btn {
        width: 38px;
        height: 38px;

        padding: 0;

        border: 1px solid var(--border);
        border-radius: 12px;

        background: #fff;
        color: var(--primary);

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;

        flex-shrink: 0;
      }

      .header-btn:active {
        transform: scale(0.94);
      }

      .header-btn svg {
        width: 18px;
        height: 18px;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      .notification-badge {
        position: absolute;

        top: 6px;
        right: 6px;

        width: 6px;
        height: 6px;

        border-radius: 50%;

        background: var(--danger);

        box-shadow: 0 0 0 2px #fff;
      }

      /* =========================================================
   MAIN
========================================================= */

      .main-content {
        flex: 1;
        min-height: 0;

        padding: 4px 20px 90px;

        overflow: hidden;

        display: flex;
        flex-direction: column;
      }

      .page-intro {
        margin-top: 1px;
      }

      .eyebrow {
        color: var(--accent);

        font-size: 8px;
        font-weight: 800;

        letter-spacing: 0.35px;
        text-transform: uppercase;
      }

      .page-title {
        margin-top: 4px;

        font-size: 20px;
        line-height: 1.2;

        font-weight: 800;

        letter-spacing: -0.5px;
      }

      .page-description {
        margin-top: 4px;

        color: var(--muted);

        font-size: 9px;
        line-height: 1.4;
      }

      /* =========================================================
   SUMMARY
========================================================= */

      .summary-grid {
        margin-top: 10px;

        display: grid;

        grid-template-columns: repeat(4, 1fr);

        gap: 6px;
      }

      .summary-card {
        min-width: 0;

        padding: 8px 6px;

        background: #fff;

        border: 1px solid var(--border);
        border-radius: 13px;
      }

      .summary-label {
        color: var(--muted);

        font-size: 5.6px;
        font-weight: 600;

        white-space: nowrap;
      }

      .summary-value {
        margin-top: 4px;

        font-size: 14px;
        line-height: 1;

        font-weight: 800;
      }

      .summary-meta {
        margin-top: 3px;

        color: #9ca3af;

        font-size: 5px;

        white-space: nowrap;
      }

      /* =========================================================
   SEARCH
========================================================= */

      .search-box {
        margin-top: 8px;

        position: relative;
      }

      .search-box svg {
        position: absolute;

        left: 10px;
        top: 50%;

        width: 14px;
        height: 14px;

        transform: translateY(-50%);

        color: #9ca3af;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;

        pointer-events: none;
      }

      .search-input {
        width: 100%;
        height: 35px;

        padding: 0 10px 0 31px;

        border: 1px solid var(--border);
        border-radius: 11px;

        background: #fff;

        color: var(--text);

        outline: none;

        font-size: 8px;
      }

      .search-input::placeholder {
        color: #9ca3af;
      }

      .search-input:focus {
        border-color: #bfdbfe;

        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.06);
      }

      /* =========================================================
   FILTER
========================================================= */

      .filter-wrap {
        margin-top: 7px;

        display: flex;

        gap: 5px;

        overflow-x: auto;

        scrollbar-width: none;
      }

      .filter-wrap::-webkit-scrollbar {
        display: none;
      }

      .filter-btn {
        flex-shrink: 0;

        height: 27px;

        padding: 0 9px;

        border: 1px solid var(--border);
        border-radius: 999px;

        background: #fff;

        color: var(--muted);

        font-size: 6px;
        font-weight: 700;

        appearance: none;
        -webkit-appearance: none;
      }

      .filter-btn.active {
        border-color: var(--primary);

        background: var(--primary);

        color: #fff;
      }

      .filter-btn:active {
        transform: scale(0.96);
      }

      /* =========================================================
   TASK HEADER
========================================================= */

      .tasks-header {
        margin-top: 9px;
        margin-bottom: 5px;

        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .tasks-title {
        font-size: 10px;
        font-weight: 800;
      }

      .task-count {
        color: #9ca3af;

        font-size: 6px;
        font-weight: 600;
      }

      /* =========================================================
   TASK LIST
========================================================= */

      .task-list {
        flex: 1;
        min-height: 0;

        display: flex;
        flex-direction: column;

        gap: 6px;

        overflow: hidden;
      }

      /* =========================================================
   TASK CARD
========================================================= */

      .task-card {
        width: 100%;

        padding: 9px;

        border: 1px solid var(--border);
        border-radius: 14px;

        background: #fff;

        display: flex;
        align-items: center;

        gap: 8px;

        text-align: left;

        appearance: none;
        -webkit-appearance: none;

        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }

      .task-card:active {
        background: #fafafa;
        transform: scale(0.995);
      }

      /* =========================================================
   TASK ICON
========================================================= */

      .task-icon {
        width: 34px;
        height: 34px;

        border-radius: 10px;

        background: var(--accent-light);
        color: var(--accent);

        display: flex;
        align-items: center;
        justify-content: center;

        flex-shrink: 0;
      }

      .task-icon.pending {
        background: var(--warning-light);
        color: var(--warning);
      }

      .task-icon.review {
        background: #f3f4f6;
        color: var(--primary);
      }

      .task-icon.completed {
        background: var(--success-light);
        color: var(--success);
      }

      .task-icon svg {
        width: 16px;
        height: 16px;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      /* =========================================================
   TASK COPY
========================================================= */

      .task-copy {
        min-width: 0;
        flex: 1;
      }

      .task-top {
        display: flex;
        align-items: center;

        gap: 5px;

        min-width: 0;
      }

      .task-wo {
        color: var(--text);

        font-size: 6px;
        font-weight: 800;

        white-space: nowrap;
      }

      .task-status {
        padding: 3px 5px;

        border-radius: 999px;

        font-size: 4.8px;
        font-weight: 800;

        white-space: nowrap;
      }

      .task-status.ready {
        color: #1d4ed8;
        background: #eff6ff;
      }

      .task-status.pending {
        color: #92400e;
        background: #fffbeb;
      }

      .task-status.review {
        color: #374151;
        background: #f3f4f6;
      }

      .task-status.completed {
        color: #166534;
        background: #f0fdf4;
      }

      .task-title {
        display: block;

        margin-top: 3px;

        font-size: 7px;
        font-weight: 700;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .task-meta {
        display: block;

        margin-top: 2px;

        color: var(--muted);

        font-size: 5.5px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* =========================================================
   TASK RIGHT
========================================================= */

      .task-right {
        flex-shrink: 0;

        min-width: 42px;

        text-align: right;
      }

      .task-progress {
        font-size: 7px;
        font-weight: 800;
      }

      .task-date {
        margin-top: 3px;

        color: #9ca3af;

        font-size: 5px;
      }

      /* =========================================================
   EMPTY STATE
========================================================= */

      .empty-state {
        display: none;

        padding: 22px 10px;

        background: #fff;

        border: 1px dashed var(--border);
        border-radius: 14px;

        text-align: center;
      }

      .empty-state.show {
        display: block;
      }

      .empty-icon {
        width: 34px;
        height: 34px;

        margin: 0 auto 7px;

        border-radius: 10px;

        background: #f3f4f6;
        color: #9ca3af;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .empty-icon svg {
        width: 16px;
        height: 16px;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }

      .empty-title {
        font-size: 8px;
        font-weight: 800;
      }

      .empty-text {
        margin-top: 3px;

        color: var(--muted);

        font-size: 6px;
      }

      /* =========================================================
   BOTTOM NAV
========================================================= */

      .bottom-nav {
        position: absolute;

        left: 0;
        right: 0;
        bottom: 0;

        width: 100%;

        height: calc(68px + env(safe-area-inset-bottom));

        padding: 7px 12px max(7px, env(safe-area-inset-bottom));

        display: grid;

        grid-template-columns: repeat(5, 1fr);

        align-items: center;

        background: rgba(255, 255, 255, 0.92);

        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);

        border-top: 1px solid rgba(229, 231, 235, 0.9);

        z-index: 100;
      }

      .nav-item {
        width: 100%;
        height: 52px;

        margin: 0;
        padding: 4px 2px;

        border: 0;

        background: transparent;

        color: var(--muted);

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;

        gap: 4px;

        font-size: 8px;
        font-weight: 600;

        line-height: 1;

        appearance: none;
        -webkit-appearance: none;
      }

      .nav-item svg {
        width: 19px;
        height: 19px;

        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;

        flex-shrink: 0;
      }

      .nav-item.active {
        color: var(--primary);
      }

      .nav-item.active svg {
        stroke-width: 2.2;
      }

      .nav-item:active {
        transform: scale(0.94);
      }

      /* =========================================================
   TOAST
========================================================= */

      .toast {
        position: absolute;

        left: 20px;
        right: 20px;

        bottom: calc(78px + env(safe-area-inset-bottom));

        padding: 10px 12px;

        border-radius: 12px;

        background: var(--primary);
        color: #fff;

        text-align: center;

        font-size: 8px;
        font-weight: 700;

        box-shadow: 0 10px 25px rgba(17, 24, 39, 0.18);

        opacity: 0;
        visibility: hidden;

        transform: translateY(8px);

        transition:
          opacity 0.18s ease,
          visibility 0.18s ease,
          transform 0.18s ease;

        z-index: 180;
      }

      .toast.show {
        opacity: 1;
        visibility: visible;

        transform: translateY(0);
      }

      /* =========================================================
   RESPONSIVE — HEIGHT
========================================================= */

      @media (max-height: 700px) {
        .app-header {
          padding-bottom: 8px;
        }

        .page-title {
          font-size: 18px;
        }

        .summary-grid {
          margin-top: 7px;
        }

        .summary-card {
          padding: 7px 6px;
        }

        .search-box {
          margin-top: 6px;
        }

        .filter-wrap {
          margin-top: 5px;
        }

        .tasks-header {
          margin-top: 7px;
        }

        .task-card {
          padding: 7px;
        }

        .task-icon {
          width: 31px;
          height: 31px;
        }
      }

      /* =========================================================
   RESPONSIVE — VERY SMALL HEIGHT
========================================================= */

      @media (max-height: 620px) {
        .page-description {
          display: none;
        }

        .summary-grid {
          margin-top: 5px;
        }

        .summary-card {
          padding: 6px 5px;
        }

        .summary-value {
          font-size: 12px;
        }

        .search-input {
          height: 32px;
        }

        .filter-btn {
          height: 25px;
        }

        .task-card {
          padding: 6px;
        }

        .task-icon {
          width: 28px;
          height: 28px;
        }

        .task-icon svg {
          width: 14px;
          height: 14px;
        }
      }

      /* =========================================================
   RESPONSIVE — WIDTH
========================================================= */

      @media (max-width: 360px) {
        .app-header {
          padding-left: 15px;
          padding-right: 15px;
        }

        .main-content {
          padding-left: 15px;
          padding-right: 15px;
        }

        .bottom-nav {
          padding-left: 7px;
          padding-right: 7px;
        }

        .summary-grid {
          gap: 4px;
        }

        .summary-card {
          padding-left: 5px;
          padding-right: 5px;
        }

        .summary-label {
          font-size: 5px;
        }

        .task-title {
          font-size: 6.7px;
        }
      }

      /* =========================================================
   DESKTOP PREVIEW
========================================================= */

      @media (min-width: 700px) {
        .app {
          padding: 30px 0;
        }

        .mobile-container {
          height: calc(100dvh - 60px);

          border-radius: 30px;

          box-shadow: 0 25px 70px rgba(15, 23, 42, 0.18);

          overflow: hidden;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <div class="mobile-container">
        <!-- =====================================================
     HEADER
===================================================== -->

        <header class="app-header">
          <button
            type="button"
            class="back-btn"
            onclick="goBack()"
            aria-label="Go back"
          >
            <svg viewBox="0 0 24 24">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>

          <div class="header-left">
            <div class="header-title">NPN / Work Management</div>

            <div class="header-subtitle">QC Portal</div>
          </div>

          <button
            type="button"
            class="header-btn"
            onclick="go('notifications.html')"
            aria-label="Notifications"
          >
            <svg viewBox="0 0 24 24">
              <path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />

              <path d="M10 21h4" />
            </svg>

            <span class="notification-badge"></span>
          </button>
        </header>

        <!-- =====================================================
     MAIN
===================================================== -->

        <main class="main-content">
          <!-- PAGE INTRO -->

          <div class="page-intro">
            <div class="eyebrow">Quality Control</div>

            <div class="page-title">My Tasks</div>

            <div class="page-description">
              View assigned QC inspections, ULO schedules and quality validation
              tasks.
            </div>
          </div>

          <!-- ===================================================
       SUMMARY
  =================================================== -->

          <section class="summary-grid">
            <div class="summary-card">
              <div class="summary-label">All</div>

              <div class="summary-value" id="countAll">05</div>

              <div class="summary-meta">Tasks</div>
            </div>

            <div class="summary-card">
              <div class="summary-label">Pending</div>

              <div class="summary-value" id="countPending">02</div>

              <div class="summary-meta">Need QC</div>
            </div>

            <div class="summary-card">
              <div class="summary-label">In Review</div>

              <div class="summary-value" id="countReview">01</div>

              <div class="summary-meta">Active</div>
            </div>

            <div class="summary-card">
              <div class="summary-label">Done</div>

              <div class="summary-value" id="countCompleted">02</div>

              <div class="summary-meta">Completed</div>
            </div>
          </section>

          <!-- ===================================================
       SEARCH
  =================================================== -->

          <div class="search-box">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="6" />

              <path d="M16 16l4 4" />
            </svg>

            <input
              type="search"
              class="search-input"
              id="searchInput"
              placeholder="Search task, work order or customer..."
              autocomplete="off"
            />
          </div>

          <!-- ===================================================
       FILTER
  =================================================== -->

          <div class="filter-wrap">
            <button type="button" class="filter-btn active" data-filter="all">
              All
            </button>

            <button type="button" class="filter-btn" data-filter="pending">
              Pending
            </button>

            <button type="button" class="filter-btn" data-filter="review">
              In Review
            </button>

            <button type="button" class="filter-btn" data-filter="completed">
              Completed
            </button>
          </div>

          <!-- ===================================================
       TASK HEADER
  =================================================== -->

          <div class="tasks-header">
            <div class="tasks-title">Assigned QC Tasks</div>

            <div class="task-count" id="visibleCount">5 tasks</div>
          </div>

          <!-- ===================================================
       TASK LIST
  =================================================== -->

          <section class="task-list" id="taskList">
            <!-- =================================================
         TASK 1
    ================================================= -->

            <button
              type="button"
              class="task-card"
              data-status="review"
              data-search="WO-2026-00124 ULO Inspection PT Nusa Data Metro Ethernet 300 Mbps KIM Medan"
              onclick="openTask('WO-2026-00124')"
            >
              <span class="task-icon">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="8" />

                  <path d="M8 12l2.5 2.5L16 9" />
                </svg>
              </span>

              <span class="task-copy">
                <span class="task-top">
                  <span class="task-wo"> WO-2026-00124 </span>

                  <span class="task-status review"> IN REVIEW </span>
                </span>

                <span class="task-title"> ULO Inspection </span>

                <span class="task-meta">
                  PT Nusa Data · Metro Ethernet 300 Mbps · KIM Medan
                </span>
              </span>

              <span class="task-right">
                <span class="task-progress"> 85% </span>

                <span class="task-date"> 16 Sep </span>
              </span>
            </button>

            <!-- =================================================
         TASK 2
    ================================================= -->

            <button
              type="button"
              class="task-card"
              data-status="pending"
              data-search="WO-2026-00127 Installation Quality Check PT Maju Network Internet Dedicated Medan"
              onclick="openTask('WO-2026-00127')"
            >
              <span class="task-icon pending">
                <svg viewBox="0 0 24 24">
                  <path d="M12 6v6l4 2" />

                  <circle cx="12" cy="12" r="8" />
                </svg>
              </span>

              <span class="task-copy">
                <span class="task-top">
                  <span class="task-wo"> WO-2026-00127 </span>

                  <span class="task-status pending"> PENDING </span>
                </span>

                <span class="task-title"> Installation Quality Check </span>

                <span class="task-meta">
                  PT Maju Network · Internet Dedicated · Medan
                </span>
              </span>

              <span class="task-right">
                <span class="task-progress"> 60% </span>

                <span class="task-date"> 17 Sep </span>
              </span>
            </button>

            <!-- =================================================
         TASK 3
    ================================================= -->

            <button
              type="button"
              class="task-card"
              data-status="pending"
              data-search="WO-2026-00122 Fiber Installation QC PT Sumatra Digital Fiber Internet Berastagi"
              onclick="openTask('WO-2026-00122')"
            >
              <span class="task-icon pending">
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14" />

    <script>
      /* =========================================================
   NAVIGATION
========================================================= */

      function go(page) {
        window.location.href = page;
      }

      function goBack() {
        if (document.referrer) {
          history.back();
        } else {
          go("dashboard.html");
        }
      }

      /* =========================================================
   OPEN TASK
========================================================= */

      function openTask(id) {
        go("task-detail.html?id=" + encodeURIComponent(id));
      }

      /* =========================================================
   FILTER STATE
========================================================= */

      let currentFilter = "all";

      /* =========================================================
   FILTER BUTTONS
========================================================= */

      const filterButtons = document.querySelectorAll(".filter-btn");

      filterButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          filterButtons.forEach(function (item) {
            item.classList.remove("active");
          });

          this.classList.add("active");

          currentFilter = this.dataset.filter;

          renderTasks();
        });
      });

      /* =========================================================
   SEARCH
========================================================= */

      const searchInput = document.getElementById("searchInput");

      searchInput.addEventListener("input", function () {
        renderTasks();
      });

      /* =========================================================
   RENDER TASKS
========================================================= */

      function renderTasks() {
        const cards = document.querySelectorAll(".task-card");

        const keyword = searchInput.value.trim().toLowerCase();

        let visible = 0;

        cards.forEach(function (card) {
          const status = card.dataset.status;

          const searchText = (card.dataset.search || "").toLowerCase();

          const matchFilter =
            currentFilter === "all" || status === currentFilter;

          const matchSearch = !keyword || searchText.includes(keyword);

          if (matchFilter && matchSearch) {
            card.style.display = "flex";

            visible++;
          } else {
            card.style.display = "none";
          }
        });

        document.getElementById("visibleCount").textContent =
          visible + (visible === 1 ? " task" : " tasks");

        const empty = document.getElementById("emptyState");

        empty.classList.toggle("show", visible === 0);
      }

      /* =========================================================
   ESCAPE SEARCH
========================================================= */

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          searchInput.value = "";

          currentFilter = "all";

          filterButtons.forEach(function (button) {
            button.classList.toggle("active", button.dataset.filter === "all");
          });

          renderTasks();
        }
      });
    </script>
