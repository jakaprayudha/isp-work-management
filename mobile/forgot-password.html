<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta name="theme-color" content="#111827" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Forgot Password - NPN Work Management</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* =====================================================
       BASE
    ===================================================== */

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --primary: #111827;
        --primary-light: #1f2937;

        --accent: #2563eb;
        --accent-light: #eff6ff;

        --text: #111827;
        --muted: #6b7280;

        --border: #e5e7eb;

        --background: #f8fafc;
        --white: #ffffff;

        --danger: #dc2626;
      }

      html,
      body {
        width: 100%;
        height: 100%;

        min-height: 100%;

        margin: 0;

        font-family: "Inter", sans-serif;

        background: var(--background);

        color: var(--text);

        overflow: hidden;
      }

      body {
        width: 100%;
        height: 100dvh;

        min-height: 100dvh;

        overflow: hidden;

        overscroll-behavior: none;

        -webkit-overflow-scrolling: auto;

        touch-action: manipulation;
      }

      /* =====================================================
       APP SHELL
    ===================================================== */

      .app {
        width: 100%;
        height: 100dvh;

        min-height: 100dvh;

        display: flex;

        justify-content: center;

        overflow: hidden;

        background:
          radial-gradient(
            circle at 50% -10%,
            rgba(37, 99, 235, 0.08),
            transparent 40%
          ),
          var(--background);
      }

      .mobile-container {
        width: 100%;

        max-width: 480px;

        height: 100dvh;

        min-height: 0;

        display: flex;

        flex-direction: column;

        padding: max(20px, env(safe-area-inset-top)) 24px
          max(16px, env(safe-area-inset-bottom)) 24px;

        overflow: hidden;

        overscroll-behavior: none;
      }

      /* =====================================================
       TOP BAR
    ===================================================== */

      .top-bar {
        width: 100%;

        height: 48px;

        min-height: 48px;

        display: flex;

        align-items: center;

        justify-content: space-between;

        flex-shrink: 0;
      }

      .back-button {
        width: 38px;

        height: 38px;

        display: flex;

        align-items: center;

        justify-content: center;

        border: 0;

        border-radius: 12px;

        background: rgba(255, 255, 255, 0.8);

        color: var(--primary);

        cursor: pointer;

        transition:
          transform 0.15s ease,
          background 0.2s ease;
      }

      .back-button:active {
        transform: scale(0.94);
      }

      .back-button svg {
        width: 19px;

        height: 19px;
      }

      .app-version {
        font-size: 11px;

        color: #9ca3af;

        font-weight: 500;
      }

      /* =====================================================
       BRAND
    ===================================================== */

      .brand {
        margin-top: clamp(28px, 8vh, 58px);

        text-align: center;

        flex-shrink: 0;
      }

      .brand-logo {
        width: 64px;

        height: 64px;

        margin: 0 auto 18px;

        display: flex;

        align-items: center;

        justify-content: center;

        border-radius: 20px;

        background: var(--primary);

        color: white;

        font-size: 22px;

        font-weight: 800;

        letter-spacing: -1px;

        box-shadow: 0 14px 30px rgba(17, 24, 39, 0.16);
      }

      .brand h1 {
        font-size: 26px;

        line-height: 1.2;

        letter-spacing: -0.7px;

        font-weight: 800;
      }

      .brand p {
        max-width: 310px;

        margin: 9px auto 0;

        font-size: 13px;

        line-height: 1.55;

        color: var(--muted);
      }

      /* =====================================================
       RESET CARD
    ===================================================== */

      .reset-card {
        width: 100%;

        margin-top: clamp(26px, 5vh, 38px);

        padding: 24px;

        flex-shrink: 0;

        background: rgba(255, 255, 255, 0.94);

        border: 1px solid rgba(229, 231, 235, 0.9);

        border-radius: 24px;

        box-shadow: 0 12px 35px rgba(15, 23, 42, 0.06);
      }

      /* =====================================================
       INFO MESSAGE
    ===================================================== */

      .info-box {
        display: flex;

        align-items: flex-start;

        gap: 10px;

        margin-bottom: 21px;

        padding: 13px;

        border-radius: 13px;

        background: var(--accent-light);

        color: #1e40af;
      }

      .info-icon {
        width: 19px;

        height: 19px;

        flex-shrink: 0;

        margin-top: 1px;
      }

      .info-box p {
        font-size: 11px;

        line-height: 1.55;
      }

      /* =====================================================
       FORM
    ===================================================== */

      .field {
        width: 100%;

        margin-bottom: 18px;
      }

      .field-label {
        display: block;

        margin-bottom: 8px;

        font-size: 13px;

        font-weight: 600;

        color: #374151;
      }

      .input-wrapper {
        position: relative;

        width: 100%;
      }

      .input-icon {
        position: absolute;

        left: 15px;

        top: 50%;

        transform: translateY(-50%);

        width: 19px;

        height: 19px;

        color: #9ca3af;

        pointer-events: none;

        z-index: 2;
      }

      .form-input {
        width: 100%;

        height: 52px;

        padding: 0 15px 0 45px;

        border: 1px solid var(--border);

        border-radius: 14px;

        outline: none;

        background: #f9fafb;

        color: var(--text);

        font-family: inherit;

        font-size: 14px;

        transition:
          border-color 0.2s ease,
          background 0.2s ease,
          box-shadow 0.2s ease;

        -webkit-appearance: none;

        appearance: none;
      }

      .form-input::placeholder {
        color: #9ca3af;
      }

      .form-input:focus {
        background: #ffffff;

        border-color: var(--accent);

        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
      }

      /* =====================================================
       SUBMIT BUTTON
    ===================================================== */

      .submit-button {
        width: 100%;

        height: 54px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 10px;

        border: 0;

        border-radius: 15px;

        background: var(--primary);

        color: white;

        font-family: inherit;

        font-size: 14px;

        font-weight: 700;

        cursor: pointer;

        box-shadow: 0 10px 20px rgba(17, 24, 39, 0.14);

        transition:
          transform 0.15s ease,
          opacity 0.2s ease;

        -webkit-appearance: none;

        appearance: none;
      }

      .submit-button:active {
        transform: scale(0.98);
      }

      .submit-button:disabled {
        opacity: 0.7;

        cursor: not-allowed;

        transform: none;
      }

      /* =====================================================
       BACK TO LOGIN
    ===================================================== */

      .back-login {
        width: 100%;

        margin-top: 17px;

        padding: 7px 0;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 6px;

        border: 0;

        background: transparent;

        color: var(--accent);

        font-family: inherit;

        font-size: 12px;

        font-weight: 600;

        cursor: pointer;
      }

      .back-login svg {
        width: 14px;

        height: 14px;
      }

      /* =====================================================
       FOOTER
    ===================================================== */

      .footer {
        width: 100%;

        margin-top: auto;

        padding-top: 15px;

        padding-bottom: 2px;

        flex-shrink: 0;

        text-align: center;
      }

      .secure {
        display: inline-flex;

        align-items: center;

        gap: 6px;

        font-size: 11px;

        color: #9ca3af;
      }

      .secure-icon {
        font-size: 12px;

        line-height: 1;
      }

      .copyright {
        margin-top: 9px;

        font-size: 10px;

        color: #c1c5cc;
      }

      /* =====================================================
       LOADING
    ===================================================== */

      .spinner {
        width: 17px;

        height: 17px;

        flex-shrink: 0;

        border: 2px solid rgba(255, 255, 255, 0.35);

        border-top-color: white;

        border-radius: 50%;

        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* =====================================================
       TOAST
    ===================================================== */

      .toast {
        position: fixed;

        left: 50%;

        bottom: max(25px, env(safe-area-inset-bottom));

        transform: translate(-50%, 20px);

        width: calc(100% - 40px);

        max-width: 420px;

        padding: 13px 16px;

        border-radius: 13px;

        background: #111827;

        color: white;

        font-size: 12px;

        line-height: 1.4;

        text-align: center;

        opacity: 0;

        pointer-events: none;

        transition:
          opacity 0.25s ease,
          transform 0.25s ease;

        z-index: 100;
      }

      .toast.show {
        opacity: 1;

        transform: translate(-50%, 0);
      }

      /* =====================================================
       SMALL MOBILE
    ===================================================== */

      @media (max-height: 700px) {
        .mobile-container {
          padding: max(14px, env(safe-area-inset-top)) 20px
            max(12px, env(safe-area-inset-bottom)) 20px;
        }

        .top-bar {
          height: 40px;

          min-height: 40px;
        }

        .brand {
          margin-top: 14px;
        }

        .brand-logo {
          width: 56px;

          height: 56px;

          margin-bottom: 11px;

          border-radius: 17px;

          font-size: 20px;
        }

        .brand h1 {
          font-size: 23px;
        }

        .brand p {
          margin-top: 6px;

          font-size: 12px;
        }

        .reset-card {
          margin-top: 18px;

          padding: 18px;

          border-radius: 20px;
        }

        .info-box {
          margin-bottom: 15px;

          padding: 11px;
        }

        .field {
          margin-bottom: 13px;
        }

        .field-label {
          margin-bottom: 6px;

          font-size: 12px;
        }

        .form-input {
          height: 47px;

          font-size: 13px;
        }

        .submit-button {
          height: 49px;
        }

        .back-login {
          margin-top: 11px;
        }

        .footer {
          padding-top: 9px;
        }

        .copyright {
          margin-top: 5px;
        }
      }

      /* =====================================================
       VERY SMALL HEIGHT
    ===================================================== */

      @media (max-height: 620px) {
        .brand {
          margin-top: 7px;
        }

        .brand-logo {
          width: 48px;

          height: 48px;

          margin-bottom: 7px;

          border-radius: 15px;

          font-size: 18px;
        }

        .brand h1 {
          font-size: 21px;
        }

        .brand p {
          display: none;
        }

        .reset-card {
          margin-top: 12px;

          padding: 15px;
        }

        .info-box {
          margin-bottom: 10px;

          padding: 9px;
        }

        .info-box p {
          font-size: 10px;
        }

        .field {
          margin-bottom: 10px;
        }

        .form-input {
          height: 44px;
        }

        .submit-button {
          height: 46px;
        }

        .back-login {
          margin-top: 7px;
        }

        .footer {
          padding-top: 5px;
        }
      }

      /* =====================================================
       DESKTOP PREVIEW
    ===================================================== */

      @media (min-width: 600px) {
        .app {
          height: 100dvh;

          min-height: 100dvh;

          padding: 30px 0;
        }

        .mobile-container {
          width: 100%;

          max-width: 480px;

          height: calc(100dvh - 60px);

          min-height: 0;

          border-radius: 30px;

          background:
            radial-gradient(
              circle at 50% -10%,
              rgba(37, 99, 235, 0.08),
              transparent 40%
            ),
            var(--background);

          box-shadow: 0 25px 70px rgba(15, 23, 42, 0.12);

          overflow: hidden;
        }
      }

      /* =====================================================
       REDUCED MOTION
    ===================================================== */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;

          animation-iteration-count: 1 !important;

          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <main class="mobile-container">
        <!-- =================================================
           TOP BAR
      ================================================= -->

        <div class="top-bar">
          <button
            type="button"
            class="back-button"
            id="backButton"
            aria-label="Back to login"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5"></path>

              <path d="M12 19l-7-7 7-7"></path>
            </svg>
          </button>

          <span class="app-version"> NPN Mobile v1.0 </span>
        </div>

        <!-- =================================================
           BRAND
      ================================================= -->

        <section class="brand">
          <div class="brand-logo">NPN</div>

          <h1>Forgot Password?</h1>

          <p>
            Don't worry. Enter your registered email and we'll help you reset
            your password.
          </p>
        </section>

        <!-- =================================================
           RESET CARD
      ================================================= -->

        <section class="reset-card">
          <!-- INFO -->

          <div class="info-box">
            <svg
              class="info-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="12" r="9"></circle>

              <path d="M12 11v5"></path>

              <path d="M12 8h.01"></path>
            </svg>

            <p>
              We'll send a password reset link to your registered email address.
            </p>
          </div>

          <!-- FORM -->

          <form id="forgotPasswordForm">
            <!-- EMAIL -->

            <div class="field">
              <label class="field-label" for="email"> Email Address </label>

              <div class="input-wrapper">
                <svg
                  class="input-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>

                  <path d="M3 7l9 6 9-6"></path>
                </svg>

                <input
                  id="email"
                  class="form-input"
                  type="email"
                  placeholder="Enter your email address"
                  autocomplete="email"
                  inputmode="email"
                  required
                />
              </div>
            </div>

            <!-- SUBMIT -->

            <button type="submit" class="submit-button" id="submitButton">
              <span id="submitText"> Send Reset Link </span>
            </button>
          </form>

          <!-- BACK TO LOGIN -->

          <button type="button" class="back-login" id="backLogin">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5"></path>

              <path d="M12 19l-7-7 7-7"></path>
            </svg>

            Back to Sign In
          </button>
        </section>

        <!-- =================================================
           FOOTER
      ================================================= -->

        <footer class="footer">
          <div class="secure">
            <span class="secure-icon"> 🔒 </span>

            Secure password recovery
          </div>

          <div class="copyright">© 2026 NPN Work Management</div>
        </footer>
      </main>
    </div>

    <!-- =====================================================
       TOAST
  ===================================================== -->

    <div class="toast" id="toast"></div>

    <script>
      /* =====================================================
       ELEMENTS
    ===================================================== */

      const form = document.getElementById("forgotPasswordForm");

      const email = document.getElementById("email");

      const submitButton = document.getElementById("submitButton");

      const submitText = document.getElementById("submitText");

      const backButton = document.getElementById("backButton");

      const backLogin = document.getElementById("backLogin");

      const toast = document.getElementById("toast");

      /* =====================================================
       TOAST
    ===================================================== */

      function showToast(message) {
        toast.textContent = message;

        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
        }, 3000);
      }

      /* =====================================================
       BACK TO LOGIN
    ===================================================== */

      function goToLogin() {
        window.location.href = "index.html";
      }

      backButton.addEventListener("click", goToLogin);

      backLogin.addEventListener("click", goToLogin);

      /* =====================================================
       FORM SUBMIT
    ===================================================== */

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const emailValue = email.value.trim();

        if (!emailValue) {
          showToast("Please enter your email address.");

          email.focus();

          return;
        }

        if (!email.checkValidity()) {
          showToast("Please enter a valid email address.");

          email.focus();

          return;
        }

        /* -----------------------------------------------
           LOADING
        ------------------------------------------------ */

        submitButton.disabled = true;

        submitText.innerHTML = `
          <span class="spinner"></span>
          Sending...
        `;

        /*
         * =================================================
         * API INTEGRATION
         * =================================================
         *
         * Replace this simulation with your API:
         *
         * fetch("/api/auth/forgot-password.php", {
         *
         *   method: "POST",
         *
         *   headers: {
         *     "Content-Type": "application/json"
         *   },
         *
         *   body: JSON.stringify({
         *     email: emailValue
         *   })
         *
         * })
         *
         * =================================================
         */

        await new Promise((resolve) => setTimeout(resolve, 1200));

        /* -----------------------------------------------
           RESET BUTTON
        ------------------------------------------------ */

        submitButton.disabled = false;

        submitText.textContent = "Send Reset Link";

        /* -----------------------------------------------
           SUCCESS
        ------------------------------------------------ */

        showToast("If the email is registered, a reset link has been sent.");

        /*
         * Future:
         *
         * window.location.href =
         *     "verify-otp.html";
         */
      });

      /* =====================================================
       ENTER KEY
    ===================================================== */

      email.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          form.requestSubmit();
        }
      });
    </script>
  </body>
</html>
