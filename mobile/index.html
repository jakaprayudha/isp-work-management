<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent" />

  <title>NPN Work Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    /* =========================================================
   NPN WORK MANAGEMENT
   MOBILE / PWA LOGIN
   ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #111827;
      --primary-light: #1f2937;

      --accent: #2563eb;
      --accent-light: #eff6ff;

      --text: #111827;
      --muted: #6b7280;

      --border: #e5e7eb;

      --background: #f8fafc;
      --white: #ffffff;

      --danger: #dc2626;
    }

    /* =========================================================
   BASE
   ========================================================= */

    html,
    body {
      width: 100%;
      height: 100%;

      min-height: 100%;
      margin: 0;

      font-family: "Inter", sans-serif;

      background: var(--background);
      color: var(--text);

      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100dvh;

      min-height: 100dvh;

      overflow: hidden;

      overscroll-behavior: none;

      -webkit-overflow-scrolling: auto;

      touch-action: manipulation;
    }

    /* =========================================================
   APP SHELL
   ========================================================= */

    .app {
      width: 100%;
      height: 100dvh;

      min-height: 100dvh;

      display: flex;
      justify-content: center;

      overflow: hidden;

      background:
        radial-gradient(circle at 50% -10%,
          rgba(37, 99, 235, 0.08),
          transparent 40%),
        var(--background);
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;

      height: 100dvh;
      min-height: 0;

      display: flex;
      flex-direction: column;

      padding: max(20px, env(safe-area-inset-top)) 24px max(16px, env(safe-area-inset-bottom)) 24px;

      overflow: hidden;

      overscroll-behavior: none;
    }

    /* =========================================================
   TOP BAR
   ========================================================= */

    .top-bar {
      width: 100%;

      height: 48px;
      min-height: 48px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      flex-shrink: 0;
    }

    .app-version {
      font-size: 11px;

      color: #9ca3af;

      font-weight: 500;

      letter-spacing: 0.1px;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      flex-shrink: 0;

      border-radius: 50%;

      background: #22c55e;

      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
    }

    /* =========================================================
   BRAND
   ========================================================= */

    .brand {
      margin-top: clamp(20px, 6vh, 46px);

      text-align: center;

      flex-shrink: 0;
    }

    .brand-logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      background: var(--primary);

      color: white;

      font-size: 25px;

      font-weight: 800;

      letter-spacing: -1px;

      box-shadow: 0 14px 30px rgba(17, 24, 39, 0.16);
    }

    .brand h1 {
      font-size: 27px;

      line-height: 1.2;

      letter-spacing: -0.8px;

      font-weight: 800;
    }

    .brand p {
      margin-top: 9px;

      font-size: 14px;

      line-height: 1.5;

      color: var(--muted);
    }

    /* =========================================================
   LOGIN CARD
   ========================================================= */

    .login-card {
      width: 100%;

      margin-top: clamp(20px, 5vh, 38px);

      padding: 24px;

      flex-shrink: 0;

      background: rgba(255, 255, 255, 0.94);

      border: 1px solid rgba(229, 231, 235, 0.9);

      border-radius: 24px;

      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.06);
    }

    /* =========================================================
   FORM FIELD
   ========================================================= */

    .field {
      width: 100%;

      margin-bottom: 18px;
    }

    .field-label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;

      font-weight: 600;

      color: #374151;
    }

    .input-wrapper {
      position: relative;

      width: 100%;
    }

    /* =========================================================
   INPUT ICON
   ========================================================= */

    .input-icon {
      position: absolute;

      left: 15px;
      top: 50%;

      transform: translateY(-50%);

      width: 19px;
      height: 19px;

      color: #9ca3af;

      pointer-events: none;

      z-index: 2;
    }

    /* =========================================================
   FORM INPUT
   ========================================================= */

    .form-input {
      width: 100%;
      height: 52px;

      padding: 0 45px 0 45px;

      border: 1px solid var(--border);

      border-radius: 14px;

      outline: none;

      background: #f9fafb;

      color: var(--text);

      font-family: inherit;

      font-size: 14px;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

      -webkit-appearance: none;
      appearance: none;
    }

    .form-input::placeholder {
      color: #9ca3af;
    }

    .form-input:focus {
      background: #ffffff;

      border-color: var(--accent);

      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
    }

    /* =========================================================
   PASSWORD TOGGLE
   ========================================================= */

    .password-toggle {
      position: absolute;

      right: 13px;
      top: 50%;

      transform: translateY(-50%);

      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 0;

      background: transparent;

      color: #9ca3af;

      cursor: pointer;

      z-index: 3;
    }

    .password-toggle svg {
      width: 19px;
      height: 19px;
    }

    /* =========================================================
   LOGIN OPTIONS
   ========================================================= */

    .login-options {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 4px 0 22px;
    }

    .remember {
      display: flex;
      align-items: center;

      gap: 8px;

      font-size: 12px;

      color: #6b7280;

      cursor: pointer;

      user-select: none;
    }

    .remember input {
      width: 16px;
      height: 16px;

      margin: 0;

      accent-color: var(--accent);

      cursor: pointer;
    }

    .forgot {
      padding: 4px 0;

      border: 0;

      background: transparent;

      color: var(--accent);

      font-family: inherit;

      font-size: 12px;

      font-weight: 600;

      cursor: pointer;
    }

    /* =========================================================
   LOGIN BUTTON
   ========================================================= */

    .login-button {
      width: 100%;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      border: 0;

      border-radius: 15px;

      background: var(--primary);

      color: white;

      font-family: inherit;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      box-shadow: 0 10px 20px rgba(17, 24, 39, 0.14);

      transition:
        transform 0.15s ease,
        opacity 0.2s ease;

      -webkit-appearance: none;
      appearance: none;

      touch-action: manipulation;
    }

    .login-button:active {
      transform: scale(0.98);
    }

    .login-button:disabled {
      opacity: 0.7;

      cursor: not-allowed;

      transform: none;
    }

    /* =========================================================
   DIVIDER
   ========================================================= */

    .divider {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 12px;

      margin: 24px 0;
    }

    .divider::before,
    .divider::after {
      content: "";

      height: 1px;

      flex: 1;

      background: var(--border);
    }

    .divider span {
      font-size: 11px;

      color: #9ca3af;

      white-space: nowrap;
    }

    /* =========================================================
   SSO BUTTON
   ========================================================= */

    .sso-button {
      width: 100%;
      height: 50px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 9px;

      border: 1px solid var(--border);

      border-radius: 14px;

      background: white;

      color: #374151;

      font-family: inherit;

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;

      -webkit-appearance: none;
      appearance: none;

      touch-action: manipulation;
    }

    .sso-button:active {
      transform: scale(0.985);
    }

    /* =========================================================
   SSO ICON
   ========================================================= */

    .sso-icon {
      width: 18px;
      height: 18px;

      border-radius: 5px;

      background: var(--accent-light);

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--accent);

      font-size: 10px;

      font-weight: 800;
    }

    /* =========================================================
   FOOTER
   ========================================================= */

    .footer {
      width: 100%;

      margin-top: auto;

      padding-top: 15px;

      padding-bottom: 2px;

      flex-shrink: 0;

      text-align: center;
    }

    .secure {
      display: inline-flex;
      align-items: center;

      gap: 6px;

      font-size: 11px;

      color: #9ca3af;
    }

    .secure-icon {
      font-size: 12px;

      line-height: 1;
    }

    .copyright {
      margin-top: 9px;

      font-size: 10px;

      color: #c1c5cc;
    }

    /* =========================================================
   LOADING
   ========================================================= */

    .spinner {
      width: 17px;
      height: 17px;

      flex-shrink: 0;

      border: 2px solid rgba(255, 255, 255, 0.35);

      border-top-color: white;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
   TOAST
   ========================================================= */

    .toast {
      position: fixed;

      left: 50%;

      bottom: max(25px, env(safe-area-inset-bottom));

      transform: translate(-50%, 20px);

      width: calc(100% - 40px);

      max-width: 420px;

      padding: 13px 16px;

      border-radius: 13px;

      background: #111827;

      color: white;

      font-size: 12px;

      line-height: 1.4;

      text-align: center;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;

      z-index: 100;
    }

    .toast.show {
      opacity: 1;

      transform: translate(-50%, 0);
    }

    /* =========================================================
   SMALL MOBILE
   iPhone SE / small Android
   ========================================================= */

    @media (max-height: 700px) {
      .mobile-container {
        padding: max(14px, env(safe-area-inset-top)) 20px max(12px, env(safe-area-inset-bottom)) 20px;
      }

      .top-bar {
        height: 40px;
        min-height: 40px;
      }

      .brand {
        margin-top: 12px;
      }

      .brand-logo {
        width: 58px;
        height: 58px;

        margin-bottom: 12px;

        border-radius: 18px;

        font-size: 21px;
      }

      .brand h1 {
        font-size: 23px;
      }

      .brand p {
        margin-top: 5px;

        font-size: 12px;
      }

      .login-card {
        margin-top: 18px;

        padding: 18px;

        border-radius: 20px;
      }

      .field {
        margin-bottom: 13px;
      }

      .field-label {
        margin-bottom: 6px;

        font-size: 12px;
      }

      .form-input {
        height: 47px;

        font-size: 13px;
      }

      .login-options {
        margin: 2px 0 16px;
      }

      .login-button {
        height: 49px;
      }

      .divider {
        margin: 16px 0;
      }

      .sso-button {
        height: 46px;
      }

      .footer {
        padding-top: 10px;
      }

      .copyright {
        margin-top: 5px;
      }
    }

    /* =========================================================
   VERY SMALL HEIGHT
   ========================================================= */

    @media (max-height: 620px) {
      .brand {
        margin-top: 8px;
      }

      .brand-logo {
        width: 50px;
        height: 50px;

        margin-bottom: 8px;

        border-radius: 16px;

        font-size: 19px;
      }

      .brand h1 {
        font-size: 21px;
      }

      .brand p {
        display: none;
      }

      .login-card {
        margin-top: 12px;

        padding: 15px;
      }

      .field {
        margin-bottom: 10px;
      }

      .form-input {
        height: 44px;
      }

      .login-options {
        margin-bottom: 12px;
      }

      .login-button {
        height: 46px;
      }

      .divider {
        margin: 12px 0;
      }

      .sso-button {
        height: 43px;
      }

      .footer {
        padding-top: 7px;
      }
    }

    /* =========================================================
   DESKTOP PREVIEW
   ========================================================= */

    @media (min-width: 600px) {
      .app {
        height: 100dvh;

        min-height: 100dvh;

        padding: 30px 0;
      }

      .mobile-container {
        width: 100%;
        max-width: 480px;

        height: calc(100dvh - 60px);

        min-height: 0;

        border-radius: 30px;

        background:
          radial-gradient(circle at 50% -10%,
            rgba(37, 99, 235, 0.08),
            transparent 40%),
          var(--background);

        box-shadow: 0 25px 70px rgba(15, 23, 42, 0.12);

        overflow: hidden;
      }
    }

    /* =========================================================
   REDUCED MOTION
   ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;

        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <main class="mobile-container">
      <!-- TOP -->
      <div class="top-bar">
        <div class="status-dot"></div>
        <span class="app-version">NPN Mobile v1.0</span>
      </div>

      <!-- BRAND -->
      <section class="brand">
        <div class="brand-logo">NPN</div>

        <h1>Work Management</h1>

        <p>
          Manage your work.<br />
          Keep your team moving.
        </p>
      </section>

      <!-- LOGIN -->
      <section class="login-card">
        <form id="loginForm">
          <!-- USERNAME -->
          <div class="field">
            <label class="field-label"> Email or Username </label>

            <div class="input-wrapper">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>

              <input
                id="username"
                class="form-input"
                type="text"
                placeholder="Enter your email or username"
                autocomplete="username"
                required />
            </div>
          </div>

          <!-- PASSWORD -->
          <div class="field">
            <label class="field-label"> Password </label>

            <div class="input-wrapper">
              <svg
                class="input-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8">
                <rect x="3" y="11" width="18" height="10" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>

              <input
                id="password"
                class="form-input"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required />

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Show password">
                <svg
                  id="eyeIcon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8">
                  <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <!-- OPTIONS -->
          <div class="login-options">
            <label class="remember">
              <input type="checkbox" id="remember" />
              <span>Remember me</span>
            </label>

            <button type="button" class="forgot" id="forgotPassword">
              Forgot password?
            </button>
          </div>

          <!-- LOGIN -->
          <button type="submit" class="login-button" id="loginButton">
            <span id="loginText"> Sign In </span>
          </button>
        </form>

        <!-- DIVIDER -->
        <div class="divider">
          <span>OR</span>
        </div>

        <!-- SSO -->
        <button type="button" class="sso-button" id="ssoButton">
          <span class="sso-icon"> N </span>

          Continue with NPN SSO
        </button>
      </section>

      <!-- FOOTER -->
      <footer class="footer">
        <div class="secure">
          <span class="secure-icon">🔒</span>
          Secure connection
        </div>

        <div class="copyright">© 2026 NPN Work Management</div>
      </footer>
    </main>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");

    const togglePassword = document.getElementById("togglePassword");

    const eyeIcon = document.getElementById("eyeIcon");

    const loginButton = document.getElementById("loginButton");

    const loginText = document.getElementById("loginText");

    const forgotPassword = document.getElementById("forgotPassword");

    const ssoButton = document.getElementById("ssoButton");

    const toast = document.getElementById("toast");

    /* =========================
       TOAST
    ========================= */

    function showToast(message) {
      toast.textContent = message;

      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    /* =========================
       PASSWORD TOGGLE
    ========================= */

    togglePassword.addEventListener("click", () => {
      const isPassword = password.type === "password";

      password.type = isPassword ? "text" : "password";

      togglePassword.setAttribute(
        "aria-label",
        isPassword ? "Hide password" : "Show password",
      );

      eyeIcon.innerHTML = isPassword ?
        `
                    <path
                        d="M3 3l18 18"
                    />
                    <path
                        d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                    />
                    <path
                        d="M9.9 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.1 3.8"
                    />
                    <path
                        d="M6.6 6.6C3.8 8.5 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.1-.9"
                    />
                ` :
        `
                    <path
                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                    />
                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    />
                `;
    });

    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const user = username.value.trim();

      const pass = password.value.trim();

      if (!user || !pass) {
        showToast("Please complete your login information.");

        return;
      }

      loginButton.disabled = true;

      loginText.innerHTML = `
                <span class="spinner"></span>
                Signing in...
            `;

      /*
       * TODO:
       * Replace this simulation with
       * your real authentication API.
       *
       * Example:
       *
       * fetch("/api/auth/login.php", {
       *     method: "POST",
       *     headers: {
       *         "Content-Type": "application/json"
       *     },
       *     body: JSON.stringify({
       *         username: user,
       *         password: pass
       *     })
       * })
       */

      await new Promise((resolve) => setTimeout(resolve, 1200));

      loginButton.disabled = false;

      loginText.textContent = "Sign In";

      showToast("Login API is not connected yet.");
    });

    /* =========================
       FORGOT PASSWORD
    ========================= */

    /* =========================
   FORGOT PASSWORD
========================= */

    forgotPassword.addEventListener("click", function(event) {
      event.preventDefault();

      window.location.href = "forgot-password.html";
    });
    /* =========================
       SSO
    ========================= */

    ssoButton.addEventListener("click", () => {
      showToast("NPN SSO authentication will be available soon.");
    });

    /* =========================
       REMEMBER USERNAME
    ========================= */

    const remember = document.getElementById("remember");

    const savedUsername = localStorage.getItem("npn_username");

    if (savedUsername) {
      username.value = savedUsername;

      remember.checked = true;
    }

    loginForm.addEventListener("submit", () => {
      if (remember.checked) {
        localStorage.setItem("npn_username", username.value.trim());
      } else {
        localStorage.removeItem("npn_username");
      }
    });
  </script>
</body>

</html>
